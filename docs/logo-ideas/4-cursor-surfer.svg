  </g>
  <text x="320" y="312" text-anchor="middle" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif" font-weight="800" font-size="52" fill="#1f2a36">Surfelappen</text>
  <text x="320" y="344" text-anchor="middle" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif" font-size="18" fill="#4a5663">Ta lappen på nettet</text>
</svg>
